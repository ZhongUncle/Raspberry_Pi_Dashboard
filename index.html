<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树莓派信息仪表盘</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .chart-container {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .disk-info {
            /* text-align: center; */
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center my-4">树莓派信息仪表盘</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="chart-container">
                    <div class="chart-title">系统信息</div>
                    <div id="sysInfo" style="text-align: left; font-size: 14px; color: #555;"></div>
                    <div class="chart-title">网络信息</div>
                    <div id="netInfo" style="text-align: left; font-size: 14px; color: #555;"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="chart-container">
                    <div class="chart-title">CPU 利用率</div>
                    <canvas id="cpuUsageChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">内存使用</div>
                    <div id="memoryUsageInfo" style="text-align: center; font-size: 14px; color: #555;"></div>
                    <canvas id="memoryChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">wlan 0 网络流量</div>
                    <canvas id="networkTrafficChart1"></canvas>
                </div>
            </div>
            <div class="col-md-4">
                <div class="chart-container">
                    <div class="chart-title">CPU 温度</div>
                    <canvas id="cpuTemperatureChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">硬盘情况</div>
                    <div id="diskInfo" class="disk-info"></div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">eth 0 网络流量</div>
                    <canvas id="networkTrafficChart2"></canvas>
                </div>
            </div>
        </div>
    </div>


    <script>
        let cpuTemperatureChart, cpuUsageChart, memoryChart, networkTrafficChart1, networkTrafficChart2, networkTrafficChart3;

        function fetchData() {
            fetch('/api/device-info')
                .then(response => response.json())
                .then(data => {
                    updateCharts(data);
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        function updateCharts(data) {
            // 更新系统信息
            const sysInfoElement = document.getElementById('sysInfo');
            sysInfoElement.innerHTML = `
                <p><b>树莓派型号:</b>&emsp;${data.sysInfoData.model}</p>
                <p><b>系统时间:</b>&emsp;&emsp;${data.sysInfoData.systemTime}</p>
                <p><b>系统版本:</b>&emsp;&emsp;${data.sysInfoData.osVersion}</p>
                <p><b>内核版本:</b>&emsp;&emsp;${data.sysInfoData.kernelVersion}</p>
            `;
            // 更新网络信息
            const netInfoElement = document.getElementById('netInfo');
            netInfoElement.innerHTML = `
                <p><b>主机名:</b>&emsp;${data.networkInfo.hostname}</p>
                <p><b>接口名:&emsp;${data.networkInfo.interfaces[0].Name}</b></p>
                <p>&emsp;<b>IP 地址:</b>&emsp;&emsp;${data.networkInfo.interfaces[0].IPAddress}</p>
                <p>&emsp;<b>MAC 地址:</b>&emsp;${data.networkInfo.interfaces[0].MACAddress}</p>
                <p><b>接口名:&emsp;${data.networkInfo.interfaces[1].Name}</b></p>
                <p>&emsp;<b>IP 地址:</b>&emsp;&emsp;${data.networkInfo.interfaces[1].IPAddress}</p>
                <p>&emsp;<b>MAC 地址:</b>&emsp;${data.networkInfo.interfaces[1].MACAddress}</p>
            `;

            // 更新 CPU 温度折线图
            if (cpuTemperatureChart.data.labels.length >= 30) {
                cpuTemperatureChart.data.labels.shift();
                cpuTemperatureChart.data.datasets[0].data.shift();
            }
            cpuTemperatureChart.data.labels.push('');
            cpuTemperatureChart.data.datasets[0].data.push(data.cpuCurInfoData.temp);
            cpuTemperatureChart.options.plugins.title.text = "温度: " + String((data.cpuCurInfoData.temp).toFixed(2)) + " °C";
            cpuTemperatureChart.update("none");

            // 更新 CPU 利用率折线图
            if (cpuUsageChart.data.labels.length >= 30) {
                cpuUsageChart.data.labels.shift();
                cpuUsageChart.data.datasets[0].data.shift();
            }
            cpuUsageChart.data.labels.push('');
            cpuUsageChart.options.plugins.title.text = String(data.cpuCurInfoData.usage.toFixed(2)) + " %";
            cpuUsageChart.data.datasets[0].data.push(data.cpuCurInfoData.usage);
            cpuUsageChart.update("none");

            // 更新内存使用折线图
            if (memoryChart.data.labels.length >= 30) {
                memoryChart.data.labels.shift();
                memoryChart.data.datasets[0].data.shift();
            }
            memoryChart.data.labels.push('');
            memoryChart.data.datasets[0].data.push((data.memoryData.total - data.memoryData.available) / 1e6);
            memoryChart.options.plugins.title.text = `${((data.memoryData.total - data.memoryData.available) / 1e6).toFixed(3)} / ${(data.memoryData.total / 1e6).toFixed(3)} GB`;
            memoryChart.options.scales.y.max = data.memoryData.total / 1e6;
            memoryChart.update("none");

            // 更新硬盘使用信息
            const diskInfoElement = document.getElementById('diskInfo');
            // 用颜色表示硬盘剩余可使用率
            diskUsageColor = "#4caf50"    // 绿色
            if (data.diskData.available < 0.5 * data.diskData.size && data.diskData.available >= 0.3 * data.diskData.size) {
                diskUsageColor = "#ff9800"  // 橙色
            } else if (data.diskData.available < 0.3 * data.diskData.size) {
                diskUsageColor = "#f44336"  // 红色
            }
            // 用颜色表示硬盘温度
            disktempColor = "#4caf50"     // 绿色
            if (data.diskData.temp > 45 && data.diskData.temp < 55) {
                disktempColor = "#ff9800"    // 橙色
            } else if (data.diskData.temp >= 55) {
                disktempColor = "#f44336"    // 红色
            }
            diskInfoElement.innerHTML = `
                <pre><b>硬盘名称：</b>${data.diskData.modelname}\n<b>总量：\t</b>${data.diskData.size} GB\n<b>使用：\t</b>${data.diskData.used} GB\n<span style="color:${diskUsageColor}"><b>空闲</b>：\t${data.diskData.available} GB</span>\n<span style="color:${disktempColor}"><b>温度</b>：\t${data.diskData.temp} 摄氏度</span>\n</pre>
            `;


            // 更新网络流量图表
            //wlan0接口
            if (networkTrafficChart1.data.labels.length >= 30) {
                networkTrafficChart1.data.labels.shift();
                networkTrafficChart1.data.datasets[0].data.shift();
                networkTrafficChart1.data.datasets[1].data.shift();
            }
            networkTrafficChart1.data.labels.push('');
            networkTrafficChart1.data.datasets[0].data.push(data.networkTraffic.wlan0receive / 1e6);
            networkTrafficChart1.data.datasets[1].data.push(data.networkTraffic.wlan0send / 1e3);
            networkTrafficChart1.data.datasets[0].label = "收：" + String((data.networkTraffic.wlan0receive / 1e3).toFixed(2)) + " KB/s";
            networkTrafficChart1.data.datasets[1].label = "发：" + String((data.networkTraffic.wlan0send / 1e3).toFixed(2)) + " KB/s";
            networkTrafficChart1.update("none");
            //eth0接口
            if (networkTrafficChart2.data.labels.length >= 30) {
                networkTrafficChart2.data.labels.shift();
                networkTrafficChart2.data.datasets[0].data.shift();
                networkTrafficChart2.data.datasets[1].data.shift();
            }
            networkTrafficChart2.data.labels.push('');
            networkTrafficChart2.data.datasets[0].data.push(data.networkTraffic.eth0receive / 1e6);
            networkTrafficChart2.data.datasets[1].data.push(data.networkTraffic.eth0send / 1e3);
            networkTrafficChart2.data.datasets[0].label = "收：" + String((data.networkTraffic.eth0receive / 1e3).toFixed(2)) + " KB/s";
            networkTrafficChart2.data.datasets[1].label = "发：" + String((data.networkTraffic.eth0send / 1e3).toFixed(2)) + " KB/s";
            networkTrafficChart2.update("none");
        }

        // 初始化CPU利用率图表
        const cpuUsageColor = function (ctx) {
            if (ctx.p0.parsed.y >= 45 && ctx.p0.parsed.y < 55) {
                return "#ff9800"  // 橙色
            } else if (ctx.p0.parsed.y >= 55) {
                return "#f44336"  // 红色
            } else {
                return "#4caf50"  // 绿色
            }
        };
        const cpuUsageCtx = document.getElementById('cpuUsageChart').getContext('2d');
        cpuUsageChart = new Chart(cpuUsageCtx, {
            type: 'line',
            data: {
                labels: Array.from({ length: 30 }, () => ''),
                datasets: [{
                    label: 'CPU 利用率',
                    data: Array(30).fill(0),
                    borderColor: '#4caf50',
                    segment: {
                        borderColor: cpuUsageCtx => cpuUsageColor(cpuUsageCtx),
                    },
                    borderWidth: 2,
                    fill: false,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'CPU 利用率'
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });

        // 初始化CPU温度图表
        const cpuTempColor = function (ctx) {
            if (ctx.p0.parsed.y >= 45 && ctx.p0.parsed.y < 55) {
                return "#ff9800"  // 橙色
            } else if (ctx.p0.parsed.y >= 55) {
                return "#f44336"  // 红色
            } else {
                return "#4caf50"  // 绿色
            }
        };
        const cpuTemperatureCtx = document.getElementById('cpuTemperatureChart').getContext('2d');
        cpuTemperatureChart = new Chart(cpuTemperatureCtx, {
            type: 'line',
            data: {
                labels: Array.from({ length: 30 }, () => ''),
                datasets: [{
                    label: 'CPU 温度',
                    data: Array(30).fill(0),
                    borderColor: "#4caf50",
                    segment: {
                        borderColor: cpuTemperatureCtx => cpuTempColor(cpuTemperatureCtx),
                    },
                    borderWidth: 2,
                    fill: false,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'CPU 温度'
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        beginAtZero: true,
                        max: 80,
                    }
                }
            }
        });

        // 初始化内存使用图表
        const memoryColor = function (ctx) {
            if (ctx.p0.parsed.y >= 0.5*(data.memoryData.total / 1e6) && ctx.p0.parsed.y < 0.8*(data.memoryData.total / 1e6)) {
                return "#ff9800"  // 橙色
            } else if (ctx.p0.parsed.y >= 0.8*(data.memoryData.total / 1e6)) {
                return "#f44336"  // 红色
            } else {
                return "#4caf50"  // 绿色
            }
        };
        const memoryCtx = document.getElementById('memoryChart').getContext('2d');
        memoryChart = new Chart(memoryCtx, {
            type: 'line',
            data: {
                labels: Array.from({ length: 30 }, () => ''),
                datasets: [{
                    label: '内存使用',
                    data: Array(30).fill(0),
                    borderColor: '#4caf50',
                    segment: {
                        borderColor: memoryCtx => cpuUsageColor(memoryCtx),
                    },
                    borderWidth: 2,
                    fill: false,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: '内存使用'
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        beginAtZero: true,
                        max: 0
                    }
                }
            }
        });
        //下面是网络速率的更新
        const networkTrafficCtx1 = document.getElementById('networkTrafficChart1').getContext('2d');
        networkTrafficChart1 = new Chart(networkTrafficCtx1, {
            type: 'line',
            data: {
                labels: Array.from({ length: 30 }, () => ''),
                datasets: [{
                    label: '收',
                    data: Array(30).fill(0),
                    backgroundColor: '#2196f3',
                    borderColor: '#2196f3',
                    borderWidth: 1,
                    fill: false,
                    pointRadius: 0
                }, {
                    label: '发',
                    data: Array(30).fill(0),
                    backgroundColor: '#9c27b0',
                    borderColor: '#9c27b0',
                    borderWidth: 1,
                    fill: false,
                    pointRadius: 0
                }]
            },
            options: {
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        beginAtZero: true,
                    }
                }
            }
        });

        const networkTrafficCtx2 = document.getElementById('networkTrafficChart2').getContext('2d');
        networkTrafficChart2 = new Chart(networkTrafficCtx2, {
            type: 'line',
            data: {
                labels: Array.from({ length: 30 }, () => ''),
                datasets: [{
                    label: '收',
                    data: Array(30).fill(0),
                    backgroundColor: '#2196f3',
                    borderColor: '#2196f3',
                    borderWidth: 1,
                    fill: false,
                    pointRadius: 0
                }, {
                    label: '发',
                    data: Array(30).fill(0),
                    backgroundColor: '#9c27b0',
                    borderColor: '#9c27b0',
                    borderWidth: 1,
                    fill: false,
                    pointRadius: 0
                }]
            },
            options: {
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        beginAtZero: true,
                    }
                }
            }
        });

        // 每秒刷新数据
        setInterval(fetchData, 1000);
    </script>
</body>

</html>
